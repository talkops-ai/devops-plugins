| `aws-startup-advisor:generic-phase-worker-rwx` | Runs one DSL phase; read, write, and shell |
| `aws-startup-advisor:llm2bedrock-code-analyzer` | Maps LLM SDK call sites and prompts |
| `aws-startup-advisor:llm2bedrock-code-rewriter` | Rewrites call sites to Bedrock |
