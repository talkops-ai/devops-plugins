apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xnetworks.aws.platform.example.org
spec:
  group: aws.platform.example.org
  names:
    kind: XNetwork
    plural: xnetworks
  claimNames:
    kind: Network
    plural: networks
  defaultCompositionRef:
    name: network-aws-standard
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [parameters]
              properties:
                parameters:
                  type: object
                  required: [cidrBlock, region, subnetCidrBlock]
                  properties:
                    cidrBlock:
                      type: string
                      description: IPv4 CIDR for the VPC; validate semantic CIDR policy outside this schema.
                      pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
                    subnetCidrBlock:
                      type: string
                      description: IPv4 CIDR for the routed public teaching subnet; it must be contained by cidrBlock.
                      pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
                    region:
                      type: string
                      description: AWS region for all composed resources.
                      pattern: '^[a-z]{2}(-gov|-isob|-iso)?-[a-z]+-[0-9]+$'
            status:
              type: object
              properties:
                vpcId: {type: string}
                internetGatewayId: {type: string}
                routeTableId: {type: string}
                subnetId: {type: string}
