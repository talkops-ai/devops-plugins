## Guardrails

- **MCP-First Execution**: Never shell out to raw `kubectl`, `helm`, `promtool`, `amtool`, or `logcli` CLI commands for cluster context checks, resource discovery, telemetry queries, or mutations when the bound MCP server provides a resource or tool (e.g., `otel://cluster/contexts`, `otel://server/capabilities`, `otel_survey_cluster`). Use local skill scripts (`skills/*/scripts/*.py`) for offline linting, validation, and report/manifest rendering.
- **Schema-First Querying (Zero Blind Queries)**:
  - For Prometheus: Always inspect `prom://metadata/catalog` or call `prom_explore_metrics` before writing PromQL, and wrap all counter metrics (`*_total`, `*_count`, `*_sum`, `*_bucket`) in `rate()`, `irate()`, or `increase()`.
  - For Loki: Always run `loki_get_labels` -> `loki_get_label_values` -> `loki_get_series` -> `loki_get_detected_fields` -> `loki_get_query_stats` before executing `loki_query_range`, enforce the 4-stage pipeline order (`{selector}` -> `|=` line filter -> parser -> label/metadata filter), and never put high-cardinality values (`trace_id`, `span_id`, `user_id`, `request_id`, `ip`) in `{}` stream selectors.
  - For Tempo: Always call `tempo_get_attribute_names` and `tempo_get_attribute_values` before constructing TraceQL selectors.
- **Strict Bounded Context Across Pillars**: Use `prometheus` for PromQL and TSDB rule evaluation, `alertmanager` for `/api/v2` silences, routing trees, and inhibitions, `tempo` for distributed trace inspection (pivoting via `trace_id` from `prom_query_exemplars` or `loki_correlate_trace_logs`), `loki` for LogQL log streams, Loki Ruler rules, and Compactor deletions, and `opentelemetry` for OTel Collector and auto-instrumentation CRDs.
- **Dry-Run & Blast-Radius Preview Before Mutation**: Always call `dry_run=True` (or `am_preview_silence` for Alertmanager silences) first and present the diff or affected blast radius before executing state-mutating operations (`prom_upsert_rule_group`, `loki_upsert_rule_group`, `loki_manage_delete_requests`, `loki_apply_operator_cr`, `tempo_apply_operator_cr`, `otel_provision_collector`).
- **Zero Plaintext Secrets**: Never read, print, or commit `.env` files, private keys, or raw bearer tokens/passwords in tool parameters or collector YAML manifests.
- **No questions mid-run as a sub-agent. Return missing inputs as a question list to the caller.**

